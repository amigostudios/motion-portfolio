<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Portfolio Page Picks</title>
<base href="../">
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Figtree:wght@400;500;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}
/* Layout: a contact sheet of films with a sticky filter strip; each destination owns one colour. */
:root{--bg:#15171c;--surface:#20232b;--line:#343843;--fg:#f1efe9;--dim:#a6a9b1;--ink:#15171c;--reel:#ff8a6b;--home:#f2c14e;--ui:#62cfdd;--none:#b4b6bd;--display:"Bricolage Grotesque",Georgia,serif;--body:"Figtree",-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1500px;margin:0 auto}
h1{margin:0;font:600 clamp(30px,5vw,46px)/1.05 var(--display);text-wrap:balance}
.lede{margin:10px 0 0;max-width:62ch;color:var(--dim)}
.who{margin:10px 0 0;color:var(--dim);font-size:14px;min-height:21px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:18px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;overflow-x:auto}
.bar button{flex:none;min-height:38px;padding:0 12px;font:500 14px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.bar button[aria-pressed=true]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.bar .copy{margin-left:auto;background:none}
section{padding-top:30px;scroll-margin-top:64px}
h2{margin:0 0 14px;font:600 21px/1.2 var(--display)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:30px 22px;align-items:start}
figure{margin:0;min-width:0}
video,figure img{display:block;width:100%;height:auto;max-height:62vh;background:#000;object-fit:contain;border-radius:3px}
figcaption{display:flex;justify-content:space-between;gap:12px;padding-top:9px;font-weight:500}
time{color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
.maybe{margin-left:6px;padding:1px 7px;font-size:12px;font-weight:500;color:var(--dim);border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.dests{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}
.dests button{min-height:44px;padding:2px 4px;font:500 13px/1.15 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.dests button:hover{border-color:var(--dim)}
.dests button[aria-pressed=true]{color:var(--ink);font-weight:600}
.dests button[data-d=reel][aria-pressed=true]{background:var(--reel);border-color:var(--reel)}
.dests button[data-d=home][aria-pressed=true]{background:var(--home);border-color:var(--home)}
.dests button[data-d=ui][aria-pressed=true]{background:var(--ui);border-color:var(--ui)}
.dests button[data-d=none][aria-pressed=true]{background:var(--none);border-color:var(--none)}
.theirs{margin-top:7px;font-size:13px;color:var(--dim);min-height:19px}
.theirs b{font-weight:600;color:var(--fg)}
.theirs .match{color:var(--ui);font-weight:600}
button:focus-visible,video:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#out{display:block;width:100%;height:220px;margin-top:14px;padding:10px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;font:13px/1.4 ui-monospace,Menlo,monospace}
.empty{padding-top:40px;color:var(--dim)}
</style>
</head><body><div class="wrap">
  <h1>Portfolio Page Picks</h1>
  <p class="lede">Choose where each piece goes: the Reel, the Home page sample or the UI samples page. A piece can go on more than one. Choose None to leave it off.</p>
  <p class="who" id="who">Loading saved picks…</p>
  <div class="bar" id="bar" role="group" aria-label="Filter pieces"></div>
  <textarea id="out" readonly hidden aria-label="Picks list"></textarea>
  <div id="list"></div>
  <p class="empty" id="empty" hidden>No pieces match this filter yet.</p>
</div>
<script>
const ITEMS=[{"k": "56", "title": "SD Airport logo reveal", "group": "Logos", "w": 1280, "h": 676, "dur": 4.2, "mark": "keep"}, {"k": "57", "title": "Experience Innovation logo", "group": "Logos", "w": 1280, "h": 720, "dur": 7.0, "mark": "keep"}, {"k": "58", "title": "Robot animation", "group": "Loops and short pieces", "w": 1280, "h": 720, "dur": 13.5, "mark": "keep"}, {"k": "59", "title": "Look Good Do Good", "group": "Logos", "w": 800, "h": 600, "dur": 15.4, "mark": "keep"}, {"k": "60", "title": "Paper shuttle", "group": "Paper rockets", "w": 1280, "h": 960, "dur": 12.1, "mark": "keep"}, {"k": "62", "title": "Jeep", "group": "Loops and short pieces", "w": 854, "h": 1280, "dur": 10.2, "mark": "keep"}, {"k": "63", "title": "GumGum Computer Vision commercial", "group": "Commercials", "w": 1280, "h": 720, "dur": 62.7, "mark": "keep"}, {"k": "34", "title": "Explorer badge rocket", "group": "Paper rockets", "w": 640, "h": 480, "dur": 8.5, "mark": "maybe"}, {"k": "54", "title": "Mama Tried", "group": "Loops and short pieces", "w": 1280, "h": 720, "dur": 11.7, "mark": "keep"}, {"k": "55", "title": "Mama Tried poster", "group": "Loops and short pieces", "w": 834, "h": 1280, "dur": 5.0, "mark": "keep"}, {"k": "01", "title": "Zebra Workcloud: Inventory Visibility (final)", "group": "Commercials", "w": 1280, "h": 720, "dur": 60.7, "mark": "keep"}, {"k": "02", "title": "Zebra Workcloud: Timekeeping (final)", "group": "Commercials", "w": 1280, "h": 720, "dur": 61.9, "mark": "keep"}, {"k": "03", "title": "Zebra Workcloud: Scheduling (final)", "group": "Commercials", "w": 1280, "h": 720, "dur": 41.4, "mark": "keep"}, {"k": "04", "title": "Zebra Workcloud commercial, 90 s", "group": "Commercials", "w": 1280, "h": 720, "dur": 90.6, "mark": "keep"}, {"k": "05", "title": "Zebra map animation", "group": "Commercials", "w": 1280, "h": 720, "dur": 11.1, "mark": "keep"}, {"k": "07", "title": "Zebra RFID: Streamline returns", "group": "Commercials", "w": 1280, "h": 720, "dur": 69.8, "mark": "keep"}, {"k": "08", "title": "Jiffy Learning: Star born", "group": "Commercials", "w": 1280, "h": 720, "dur": 32.4, "mark": "keep"}, {"k": "09", "title": "Jiffy Learning: Four chords (animatic)", "group": "Commercials", "w": 1280, "h": 720, "dur": 30.0, "mark": "keep"}, {"k": "d13", "title": "Jiffy Learning: Untangle", "group": "Commercials", "w": 1280, "h": 720, "dur": 18.0}, {"k": "10", "title": "SD Airport holiday spot", "group": "Commercials", "w": 1280, "h": 720, "dur": 70.8, "mark": "keep"}, {"k": "12", "title": "Gordini brand awareness", "group": "Commercials", "w": 1280, "h": 720, "dur": 94.7, "mark": "keep"}, {"k": "13", "title": "GumGum Visual Atlantis", "group": "Commercials", "w": 1280, "h": 720, "dur": 81.8, "mark": "keep"}, {"k": "14", "title": "Skatelite motion preview", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 15.0, "mark": "maybe"}, {"k": "15", "title": "Austin reel", "group": "Commercials", "w": 1280, "h": 720, "dur": 94.3, "mark": "keep"}, {"k": "17", "title": "Reef Fanning Slide", "group": "Commercials", "w": 1024, "h": 1280, "dur": 11.8, "mark": "keep"}, {"k": "20", "title": "Knock-On", "group": "Loops and short pieces", "w": 1280, "h": 720, "dur": 20.0, "mark": "keep"}, {"k": "21", "title": "Robot loop", "group": "Loops and short pieces", "w": 800, "h": 600, "dur": 16.1, "mark": "keep"}, {"k": "22", "title": "DKNG beach cabin", "group": "Loops and short pieces", "w": 800, "h": 600, "dur": 20.0, "mark": "keep"}, {"k": "23", "title": "Norma's Bee", "group": "Loops and short pieces", "w": 1280, "h": 1280, "dur": 12.4, "mark": "keep"}, {"k": "24", "title": "Rocket fist", "group": "Loops and short pieces", "w": 1280, "h": 720, "dur": 7.2, "mark": "keep"}, {"k": "25", "title": "Heel Bite", "group": "Loops and short pieces", "w": 1280, "h": 720, "dur": 8.1, "mark": "keep"}, {"k": "26", "title": "Avoura pickleball paddle", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 11.7, "mark": "keep"}, {"k": "27", "title": "Rocket animation", "group": "Paper rockets", "w": 936, "h": 1280, "dur": 15.0, "mark": "keep"}, {"k": "31", "title": "Paper Rocket animation 03", "group": "Paper rockets", "w": 1000, "h": 1000, "dur": 5.1, "mark": "keep"}, {"k": "35", "title": "NASA badge: Discovery", "group": "Paper rockets", "w": 640, "h": 640, "dur": 6.7, "mark": "keep"}, {"k": "36", "title": "Shuttle", "group": "Paper rockets", "w": 1280, "h": 720, "dur": 8.0, "mark": "keep"}, {"k": "37", "title": "SR-71", "group": "Paper rockets", "w": 1280, "h": 1280, "dur": 15.6, "mark": "keep"}, {"k": "39", "title": "Patchwork Studios", "group": "Logos", "w": 1280, "h": 720, "dur": 7.9, "mark": "keep"}, {"k": "40", "title": "The General, new version", "group": "Logos", "w": 1280, "h": 720, "dur": 7.7, "mark": "keep"}, {"k": "41", "title": "The General, NYC Observation", "group": "Logos", "w": 1280, "h": 720, "dur": 5.8, "mark": "keep"}, {"k": "45", "title": "Mammoth logo reveal", "group": "Logos", "w": 1280, "h": 720, "dur": 5.0, "mark": "keep"}, {"k": "d12", "title": "PITH blood orange, short cut", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 7.1}, {"k": "d01", "title": "Kawasaki part swaps", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 24.7}, {"k": "d02", "title": "CamelBak zipper, branded", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 8.5}, {"k": "d03", "title": "CamelBak zipper, full cut", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 26.4}, {"k": "d06", "title": "Glass cross turntable", "group": "3D and VFX", "w": 576, "h": 576, "dur": 6.0}, {"k": "d07", "title": "Soda can 3D preview", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 18.0}, {"k": "d09", "title": "Avoura Rhapsody Pink paddle", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 11.7}, {"k": "d11", "title": "Jiffy laptop v1", "group": "3D and VFX", "w": 1280, "h": 720, "dur": 5.0}, {"k": "c01", "title": "BSP final video", "group": "Commercials", "w": 1280, "h": 720, "dur": 150.2}];
const GROUPS=["Commercials","3D and VFX","Loops and short pieces","Paper rockets","Logos"];
const DESTS=[["reel","Reel"],["home","Home page"],["ui","UI samples"],["none","None"]];
const LABEL=Object.fromEntries(DESTS);
const KEY="portfolio-page-picks";
let mine={},others={},names={},filter="all",db=null,me=null,user=null,dirty=false,saving=false,saveError="",loaded=false;
try{mine=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const figs={};
const list=document.getElementById("list"),who=document.getElementById("who"),bar=document.getElementById("bar"),out=document.getElementById("out"),empty=document.getElementById("empty");
const fmt=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
GROUPS.forEach(g=>{
  const s=el("section");s.dataset.g=g;s.appendChild(el("h2",null,g));const grid=el("div","grid");s.appendChild(grid);list.appendChild(s);
  ITEMS.filter(i=>i.group===g).forEach(i=>{
    const f=el("figure");if(i.img){const m=el("img");m.src="i/"+i.k+".jpg";m.alt=i.title;m.loading="lazy";m.width=i.w;m.height=i.h;m.style.aspectRatio=i.w+"/"+i.h;f.appendChild(m)}else{const v=el("video");v.controls=true;v.playsInline=true;v.preload="none";v.poster="p/"+i.k+".jpg";v.src="v/"+i.k+".mp4";v.width=i.w;v.height=i.h;v.style.aspectRatio=i.w+"/"+i.h;f.appendChild(v)}
    const c=el("figcaption"),t=el("span",null,i.title);if(i.mark==="maybe")t.appendChild(el("span","maybe","Maybe"));c.append(t,i.img?el("time",null,"Still"):el("time",null,fmt(i.dur)));f.appendChild(c);
    const d=el("div","dests");d.setAttribute("role","group");d.setAttribute("aria-label","Where "+i.title+" goes");
    DESTS.forEach(([id,label])=>{const b=el("button",null,label);b.type="button";b.dataset.d=id;b.addEventListener("click",()=>toggle(i.k,id));d.appendChild(b)});
    f.appendChild(d);f.appendChild(el("div","theirs"));grid.appendChild(f);figs[i.k]=f;
  });
});
document.addEventListener("play",e=>document.querySelectorAll("video").forEach(v=>{if(v!==e.target)v.pause()}),true);
const FILTERS=[["all","All"],["todo","Needs my pick"],["reel","Reel"],["home","Home page"],["ui","UI samples"],["none","None"],["differ","We differ"]];
FILTERS.forEach(([id,label])=>{const b=el("button",null,label);b.type="button";b.dataset.f=id;b.dataset.l=label;b.addEventListener("click",()=>{filter=id;paint();scrollTo({top:Math.min(scrollY,bar.offsetTop)})});bar.appendChild(b)});
const copy=el("button","copy","Copy list");copy.type="button";bar.appendChild(copy);
const people=()=>Object.keys(others);
const pick=k=>mine[k]||[];
const anyone=k=>[pick(k),...people().map(u=>(others[u][k]||[]))];
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const differs=k=>{const p=anyone(k).filter(a=>a.length);return p.length>1&&!p.every(a=>same(a,p[0]))};
const matches=k=>{const p=anyone(k).filter(a=>a.length);return p.length>1&&p.every(a=>same(a,p[0]))};
function show(k){if(filter==="all")return true;if(filter==="todo")return !pick(k).length;if(filter==="differ")return differs(k);return anyone(k).some(a=>a.includes(filter))}
function paint(){
  ITEMS.forEach(i=>{
    const f=figs[i.k],m=pick(i.k);f.hidden=!show(i.k);
    f.querySelectorAll(".dests button").forEach(b=>b.setAttribute("aria-pressed",m.includes(b.dataset.d)));
    const t=f.querySelector(".theirs");t.textContent="";
    people().forEach((u,n)=>{const a=others[u][i.k]||[];if(!a.length)return;if(t.childNodes.length)t.append(" · ");t.append(el("b",null,(names[u]||"Partner")+": "),a.map(x=>LABEL[x]).join(", "))});
    if(matches(i.k)){t.append(" ");t.appendChild(el("span","match","Match"))}
  });
  document.querySelectorAll("section").forEach(s=>{s.hidden=!s.querySelector("figure:not([hidden])")});
  empty.hidden=ITEMS.some(i=>show(i.k));
  bar.querySelectorAll("[data-f]").forEach(b=>{const id=b.dataset.f;b.setAttribute("aria-pressed",id===filter);
    const n=id==="all"?ITEMS.length:id==="todo"?ITEMS.filter(i=>!pick(i.k).length).length:id==="differ"?ITEMS.filter(i=>differs(i.k)).length:ITEMS.filter(i=>anyone(i.k).some(a=>a.includes(id))).length;
    b.textContent=b.dataset.l+" "+n});
  status();
}
function status(){
  if(saveError){who.textContent=saveError;return}
  if(db&&!loaded){who.textContent="Loading saved picks…";return}
  if(!db){who.textContent=window.claude?"Your picks are saved in this browser only. Sign in to Claude to share them.":"Your picks save in this browser. When you are done, use Copy list and send it over.";return}
  const n=people().map(u=>names[u]||"Partner");
  who.textContent=(saving||dirty?"Saving…":"Picks saved.")+(n.length?" Showing picks from "+n.join(", ")+".":" Your partner's picks appear here as soon as they choose.");
}
function toggle(k,d){
  let a=pick(k).slice();
  if(a.includes(d))a=a.filter(x=>x!==d);
  else if(d==="none")a=["none"];
  else a=a.filter(x=>x!=="none").concat(d);
  if(a.length)mine[k]=a;else delete mine[k];
  try{localStorage.setItem(KEY,JSON.stringify(mine))}catch(e){}
  dirty=true;saveError="";paint();save();
}
async function save(){
  if(!db||!me||!loaded||saving||!dirty)return;
  saving=true;dirty=false;
  try{await db.doc("picks/"+me).set({choices:mine})}
  catch(e){dirty=true;saveError="Your latest pick did not save. Ask the owner for Contributor access, then try again."}
  saving=false;status();
  if(dirty&&!saveError)save();
}
copy.addEventListener("click",()=>{
  const lines=[];
  ITEMS.forEach(i=>{const p=[];if(pick(i.k).length)p.push("Me: "+pick(i.k).map(x=>LABEL[x]).join(", "));
    people().forEach(u=>{const a=others[u][i.k]||[];if(a.length)p.push((names[u]||"Partner")+": "+a.map(x=>LABEL[x]).join(", "))});
    lines.push(i.title+(p.length?" | "+p.join(" | "):" | no picks yet"))});
  const t=lines.join("\n");
  const fallback=()=>{out.value=t;out.hidden=false;out.focus();out.select();copy.textContent="Copy from the box"};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>{out.hidden=true;copy.textContent="Copied";setTimeout(()=>{copy.textContent="Copy list"},2000)},fallback);else fallback();
});
paint();
(async()=>{
  try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")])}catch(e){db=null}
  if(!db||!user){db=null;paint();return}
  me=await user.id();
  if(!me){db=null;paint();return}
  const timer=setTimeout(()=>{if(who.textContent.startsWith("Loading"))who.textContent="Saved picks are taking a while to load. Your picks will save once they do. Reload if this stays."},10000);
  let first=true;
  db.collection("picks").onSnapshot(async snap=>{
    clearTimeout(timer);
    const next={};let own=null;
    snap.docs.forEach(d=>{const c=(d.data()||{}).choices||{};if(d.id===me)own=c;else next[d.id]=c});
    others=next;
    if(first){first=false;const local=mine,o=own||{};mine=dirty?Object.assign({},o,local):Object.assign({},local,o);loaded=true;if(dirty||Object.keys(mine).length>Object.keys(o).length){dirty=true;save()}}
    const ids=Object.keys(others);
    if(ids.length){const ps=await user.profiles(ids);ids.forEach(id=>{names[id]=(ps[id]&&ps[id].name)||"Partner"})}
    paint();
  },()=>{who.textContent="Live updates stopped. Reload the page to see new picks."});
})();
</script>
</body></html>
